[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nps"
version = "0.1.0"
description = "Pipeline for fully synthetic brand imagery with audit trail"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pillow>=10.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Only needed where the real model runs. Licences: docs/LIZENZPRUEFUNG.md.
gpu = [
    "torch>=2.6",
    "diffusers>=0.42.1",
    "transformers",
    "accelerate>=0.31",
    "safetensors>=0.8",
    "huggingface-hub>=1.32",
]

[project.scripts]
nps = "nps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
