[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nps"
version = "0.1.0"
description = "Pipeline for fully synthetic brand imagery with audit trail"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pillow>=10.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nps = "nps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
